name: Operations health
on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: operations-health
  cancel-in-progress: false
jobs:
  health:
    # Opt in only after canonical origin and the owner's authorized inbox are configured.
    if: vars.OPS_MONITOR_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check external health and send authorized SMTP alert on failure
        id: probe
        run: node scripts/operational-health.mjs
        env:
          OPS_HEALTH_ORIGIN: ${{ vars.OPS_HEALTH_ORIGIN }}
          OPS_HEALTH_ALLOWED_ORIGINS: ${{ vars.OPS_HEALTH_ALLOWED_ORIGINS }}
          OPS_SEND_ALERTS: '1'
          OPS_ALERT_TO: ${{ vars.OPS_ALERT_TO }}
          MAIL_HOST: ${{ secrets.OPS_MAIL_HOST }}
          MAIL_PORT: ${{ vars.OPS_MAIL_PORT }}
          MAIL_FROM: ${{ secrets.OPS_MAIL_FROM }}
          MAIL_USER: ${{ secrets.OPS_MAIL_USER }}
          MAIL_PASS: ${{ secrets.OPS_MAIL_PASS }}
          OPS_BACKUP_ENABLED: ${{ vars.OPS_BACKUP_ENABLED }}
          OPS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
      - name: Verify the previous scheduled probe completed within 45 minutes
        if: ${{ !cancelled() && github.event_name == 'schedule' && github.run_attempt == '1' && (steps.probe.outcome == 'success' || steps.probe.outcome == 'failure') }}
        run: node scripts/operational-health.mjs --cadence
        env:
          OPS_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITHUB_TOKEN: ${{ github.token }}
          OPS_HEALTH_ORIGIN: ${{ vars.OPS_HEALTH_ORIGIN }}
          OPS_HEALTH_ALLOWED_ORIGINS: ${{ vars.OPS_HEALTH_ALLOWED_ORIGINS }}
          OPS_SEND_ALERTS: ${{ steps.probe.outcome == 'success' && '1' || '0' }}
          OPS_ALERT_TO: ${{ vars.OPS_ALERT_TO }}
          MAIL_HOST: ${{ secrets.OPS_MAIL_HOST }}
          MAIL_PORT: ${{ vars.OPS_MAIL_PORT }}
          MAIL_FROM: ${{ secrets.OPS_MAIL_FROM }}
          MAIL_USER: ${{ secrets.OPS_MAIL_USER }}
          MAIL_PASS: ${{ secrets.OPS_MAIL_PASS }}
