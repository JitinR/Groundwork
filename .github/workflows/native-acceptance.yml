name: Native runtime acceptance

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.gitattributes'
      - '.github/workflows/native-acceptance.yml'
      - 'scripts/*native*'
      - 'server/src/nativeAdapters.ts'
      - 'server/src/nativeWorker*.ts'
      - 'server/src/nativeJobs.ts'
      - 'server/src/routes/nativeWorker.ts'
      - 'server/src/engineeringBasis.ts'
      - 'package-lock.json'
  pull_request:
    paths:
      - '.gitattributes'
      - '.github/workflows/native-acceptance.yml'
      - 'scripts/*native*'
      - 'server/src/nativeAdapters.ts'
      - 'server/src/nativeWorker*.ts'
      - 'server/src/nativeJobs.ts'
      - 'server/src/routes/nativeWorker.ts'
      - 'server/src/engineeringBasis.ts'
      - 'package-lock.json'

permissions:
  contents: read

concurrency:
  group: native-acceptance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  isolated-runtime:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      GROUNDWORK_NATIVE_ACCEPTANCE_ROOT: /var/lib/groundwork-native-acceptance-ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build -w server
      - run: node --import tsx scripts/generate-native-validation-fixtures.mjs
      - name: Prepare protected staging and readable evidence paths
        run: |
          stat -c '%a %u %g %n' /opt /var /var/lib
          sudo install -d -m 0755 "$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT"
          mkdir -p artifacts/native-worker-acceptance
      - name: Install Ubuntu source-build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends build-essential gfortran cmake curl ca-certificates xz-utils pkg-config tcl-dev tk-dev libtcl8.6 libblas-dev liblapack-dev libeigen3-dev libhdf5-dev zlib1g-dev python3 python3-dev util-linux
      - name: Stage Tcl scripts from the matching Ubuntu package
        run: |
          sudo /usr/bin/bash -ceu '
            package_root="$1/tcl-package"
            install -d -m 0700 "$package_root"
            cd "$package_root"
            version=$(dpkg-query -W -f="\${Version}" libtcl8.6)
            apt-get -qq download "libtcl8.6=$version"
            archives=(libtcl8.6_*.deb)
            test "${#archives[@]}" -eq 1
            test -f "${archives[0]}"
            dpkg-deb --extract "${archives[0]}" "$package_root/extracted"
            library="$package_root/extracted/usr/share/tcltk/tcl8.6"
            test -f "$library/init.tcl"
            find "$library" -type d -exec chmod 0755 {} +
            find "$library" -type f -exec chmod 0644 {} +
          ' -- "$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT"
      - name: Verify source hashes and build supported native versions
        run: sudo env GROUNDWORK_NATIVE_ACCEPTANCE_ROOT="$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT" GROUNDWORK_NATIVE_BUILD_JOBS=4 bash scripts/build-native-acceptance.sh > native-build.log 2>&1
      - name: Run real adapters without host data, credentials or network
        run: sudo env GROUNDWORK_NATIVE_ACCEPTANCE_ROOT="$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT" GROUNDWORK_NATIVE_NODE_PATH="$(command -v node)" bash scripts/run-native-acceptance.sh
      - name: Verify executor request parser boundaries
        run: python3 -I -S scripts/test-native-executor-broker.py
      - name: Verify sealed worker, real HTTPS authority, native execution and cancellation
        run: |
          native_node="$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT/ci-node/node"
          sudo install -d -m 0755 "$(dirname "$native_node")"
          sudo install -m 0755 "$(command -v node)" "$native_node"
          cmp -- "$(command -v node)" "$native_node"
          sudo systemd-run --wait --collect --pipe --unit=groundwork-native-ci \
            --property='Delegate=cpu memory pids' --property=DelegateSubgroup=runner \
            /usr/bin/bash -ceu '
              parent=/sys/fs/cgroup/system.slice/groundwork-native-ci.service
              IFS= read -r current < /proc/self/cgroup
              test "$current" = "0::/system.slice/groundwork-native-ci.service/runner"
              printf "+cpu +memory +pids\n" > "$parent/cgroup.subtree_control"
              exec /usr/bin/python3 -I -S "$1/scripts/run-native-worker-acceptance.py" \
                --repo "$1" --node "$2" --cgroup-parent "$parent" --with-authority \
                --runtime "$3/runtime" --acceptance-root "$3/groundwork-native-worker-acceptance" \
                --tcl-library "$3/tcl-package/extracted/usr/share/tcltk/tcl8.6" \
                --authority-uid "$4" --authority-gid "$5"
            ' -- "$GITHUB_WORKSPACE" "$native_node" "$GROUNDWORK_NATIVE_ACCEPTANCE_ROOT" "$(id -u)" "$(id -g)"
      - name: Save synthetic native acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-acceptance-${{ github.sha }}
          path: |
            artifacts/native-acceptance/
            artifacts/native-worker-acceptance/
            native-build.log
          retention-days: 14
          if-no-files-found: error
